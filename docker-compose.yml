version: '3.8'

services:
  web:
    build: .
    container_name: elevora_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://elevora_user:elevora_secret@db:5432/elevora_db
      - SECRET_KEY=production-secure-elevora-key-987654321
      - PORT=8000
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  db:
    image: postgres:15-alpine
    container_name: elevora_postgres
    restart: always
    environment:
      POSTGRES_USER: elevora_user
      POSTGRES_PASSWORD: elevora_secret
      POSTGRES_DB: elevora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
