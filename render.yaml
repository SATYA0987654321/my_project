services:
  - type: web
    name: elevora-resume-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elevora-db
          property: connectionString

databases:
  - name: elevora-db
    plan: free
    databaseName: elevora_db
    user: elevora_user
